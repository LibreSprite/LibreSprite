name: Windows x86_64

on:
  push:
    branches: [ master ]
    tags:
      - '*'
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'NO_SW_CHANGE') && !contains(github.event.pull_request.body, 'NO_SW_CHANGE') }}

    runs-on: windows-latest

    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        release: false
        update: false
        install: >-
          base-devel
          git
          mingw-w64-x86_64-nodejs
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make
          mingw-w64-x86_64-curl
          mingw-w64-x86_64-freetype
          mingw-w64-x86_64-giflib
          mingw-w64-x86_64-libjpeg-turbo
          mingw-w64-x86_64-libpng
          mingw-w64-x86_64-libwebp
          mingw-w64-x86_64-pixman
          mingw-w64-x86_64-SDL2
          mingw-w64-x86_64-SDL2_image
          mingw-w64-x86_64-tinyxml2
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-libarchive

    - uses: actions/checkout@v3
      with:
        submodules: 'true'
    - name: Check for git tag
      id: check_tag
      shell: bash
      run: |
        TAG=$(git describe --exact-match --tags 2>/dev/null) || true
        if [ -n "$TAG" ]; then
          echo "has_tag=true" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
        else
          echo "has_tag=false" >> $GITHUB_OUTPUT
        fi
    - name: Get short commit hash
      id: commit
      shell: bash
      run: |
        SHORT_HASH=$(git rev-parse --short HEAD)
        echo "short_hash=$SHORT_HASH" >> $GITHUB_OUTPUT
    - name: Prepare release version
      shell: bash
      run: |
        sed -i "s/\"local build\"/\"${{ steps.commit.outputs.short_hash }}\"/g" src/config.h
        if [ "${{ steps.check_tag.outputs.has_tag }}" = "true" ]; then
          VER="${{ steps.check_tag.outputs.version }}"
          echo "$VER" | grep -Eq '^[0-9]+(\.[0-9]+)*' || { echo "::error::tag ${{ steps.check_tag.outputs.tag }} has no numeric version"; exit 1; }
          ISS_VER=$(printf '%s' "$VER" | tr -cd '0-9.')
          echo "$ISS_VER" | grep -Eq '^[0-9]+(\.[0-9]+){0,3}$' || { echo "::error::$VER does not yield a valid Inno AppVersion ($ISS_VER)"; exit 1; }
          sed -i "s/^#define MyAppVersion.*/#define MyAppVersion \"$ISS_VER\"/" packaging/windows/WindowsInstaller.iss
        fi
    - shell: msys2 {0}
      run: |
        mkdir build
        cd build
        if [ "${{ steps.check_tag.outputs.has_tag }}" = "true" ]; then
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release \
            -DRELEASE_TAG=ON \
            -DRELEASE_VERSION="${{ steps.check_tag.outputs.version }}" ..
        else
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release ..
        fi
        make -j 4
        cd ..
        rm build/bin/gen.exe
        node packaging/windows/package_win.js build/bin/libresprite.exe
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.check_tag.outputs.has_tag == 'true' && format('libresprite-{0}-windows-x86_64', steps.check_tag.outputs.tag) || 'libresprite-windows-x86_64' }}
        path: |
          build/bin/*
    - name: Install Inno Setup
      if: startsWith(github.ref, 'refs/tags/')
      run: choco install innosetup --version=6.7.1 -y
    - name: Build installer
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        iscc packaging\windows\WindowsInstaller.iss
        Rename-Item packaging\windows\LibreSpriteInstaller.exe "libresprite-${{ steps.check_tag.outputs.tag }}-windows-x86_64-installer.exe"
    - name: Upload installer
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: libresprite-${{ steps.check_tag.outputs.tag }}-windows-x86_64-installer
        path: packaging/windows/libresprite-${{ steps.check_tag.outputs.tag }}-windows-x86_64-installer.exe
        if-no-files-found: error
    - name: Package release zip
      if: startsWith(github.ref, 'refs/tags/')
      run: Compress-Archive -Path build/bin/* -DestinationPath "libresprite-${{ steps.check_tag.outputs.tag }}-windows-x86_64.zip"
    - name: Attach the release to GitHub
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: |
          libresprite-${{ steps.check_tag.outputs.tag }}-windows-x86_64.zip
          packaging/windows/libresprite-${{ steps.check_tag.outputs.tag }}-windows-x86_64-installer.exe
        fail_on_unmatched_files: true
